name: vehicle-makes-service

services:
  dynamodb:
    image: amazon/dynamodb-local:latest
    container_name: vehicle-makes-dynamodb
    command: '-jar DynamoDBLocal.jar -sharedDb -dbPath ./data'
    working_dir: /home/dynamodblocal
    ports:
      - '${DYNAMODB_PORT:-8000}:8000'
    volumes:
      - './docker/dynamodb:/home/dynamodblocal/data'
    healthcheck:
      test: ['CMD-SHELL', 'curl -s -o /dev/null http://localhost:8000 || exit 1']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    build:
      context: .
    container_name: vehicle-makes-api
    ports:
      - '${PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      DYNAMODB_REGION: ${DYNAMODB_REGION:-us-east-1}
      DYNAMODB_TABLE_NAME: ${DYNAMODB_TABLE_NAME:-VehicleMakes}
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      INGEST_ON_STARTUP: 'true'
      INGESTION_CONCURRENCY: ${INGESTION_CONCURRENCY:-3}
      INGESTION_MAX_MAKES: ${INGESTION_MAX_MAKES:-200}
    depends_on:
      dynamodb:
        condition: service_healthy
    restart: unless-stopped
